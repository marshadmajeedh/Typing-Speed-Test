<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Typing Speed Test</title>
            <link rel="stylesheet" href="/typing-speed-test/css/style.css">
        </head>

        <body>
            <div class="feature-container">
                <div class="timer">
                    <div>Timer</div>
                    <span class="minute">00</span><span>:</span><span class="second">00</span>
                </div>

                <div class="reset">
                    <button>Reset</button>
                </div>

                <div class="total-keystroke">
                    <div>Total keystrokes</div>
                    <div class="keystroke-count">00</div>
                </div>

                <div class="total-error">
                    <div>Total errors</div>
                    <div class="error-count">00</div>
                </div>
                
            </div>
            <div class="text-area-container">
            </div>
            
            <script type="module" src="/typing-speed-test/js/phaseTwoJavaScript.js"></script>
        </body>
    </html>
